name: Preparazione del rilascio
# Opens the pull request release/vX.Y.Z with the new CHANGELOG.md section and
# the version in app/package.json. Policy in docs/agents/versioning.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione esplicita (X.Y.Z, o X.Y.Z-beta.N per una pre-release). Vuota: calcolata dai Conventional Commits dall'ultimo tag v*"
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # A personal token lets the pull request start the required checks.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test degli script
        run: node --test scripts/release/lib.test.mjs scripts/release/cli.test.mjs scripts/conventional-commits/lib.test.mjs
      - name: Changelog
        id: changelog
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/cli.mjs prepare "$VERSION"
      - name: Versione del pacchetto
        working-directory: app
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          branch="release/v$VERSION"
          title="chore(release): v$VERSION"
          # The same check the pull request meets in conventional-commits.yml.
          node scripts/conventional-commits/cli.mjs branch-name "$branch"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              echo "Il branch $branch ha già la PR #$open aperta: chiuderla o unirla prima di rigenerarla." >&2
              exit 1
            fi
            # Left by an earlier run whose pull request was never opened: rebuilt from main.
            echo "Il branch $branch esiste senza PR aperta: lo rigenero da main."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md app/package.json app/package-lock.json
          git commit -m "$title"
          git push --force origin "$branch"
          body="Rilascio \`v$VERSION\` preparato dal workflow \`release-prepare.yml\`. Rivedere la sezione di \`CHANGELOG.md\`: si può correggere in questa PR. All'unione su \`main\`, \`release-publish.yml\` crea il tag \`v$VERSION\` e la release con queste note. Il commit di unione su \`main\` usa l'oggetto \`$title (#<numero>)\`."
          if gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            exit 0
          fi
          # GitHub refuses the pull request when the repository does not let Actions create pull requests
          # and RELEASE_TOKEN is not set. The branch stays pushed: the pull request is opened by hand.
          echo "::warning::La PR di rilascio non è stata aperta. Il branch $branch è pronto: vedere il riepilogo della run."
          {
            echo "## PR di rilascio da aprire a mano"
            echo
            echo "Il branch \`$branch\` è stato pubblicato con la sezione \`v$VERSION\` di \`CHANGELOG.md\` e la versione in \`app/package.json\`, ma GitHub non ha permesso al workflow di aprire la pull request."
            echo
            echo "Per aprirla ora:"
            echo
            echo '```'
            echo "gh pr create --repo $GITHUB_REPOSITORY --base main --head $branch --title \"$title\" --body \"Rilascio v$VERSION preparato da release-prepare.yml. Rivedere la sezione di CHANGELOG.md prima di unire la PR.\""
            echo '```'
            echo
            echo "Perché le prossime run la aprano da sole, la persona sceglie una delle due strade:"
            echo
            echo "- Settings, Actions, General, Workflow permissions: attivare \"Allow GitHub Actions to create and approve pull requests\";"
            echo "- oppure aggiungere il segreto \`RELEASE_TOKEN\` (token personale con accesso al repository), che fa partire anche i controlli sulla PR."
          } >> "$GITHUB_STEP_SUMMARY"
