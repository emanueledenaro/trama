name: Electron
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dipendenze
        run: npm ci
      - name: Nomi dei file su dischi senza distinzione di maiuscole
        run: npm run check:names
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Prova dell'interfaccia
        run: xvfb-run -a npm run ui-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: app/ui-check
