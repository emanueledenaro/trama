name: Dipendenze
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test dello script
        run: node --test scripts/licenses/lib.test.mjs scripts/release/lib.test.mjs
      - name: Licenze delle dipendenze
        run: node scripts/licenses/cli.mjs app/package-lock.json
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Dependency review needs the repository's dependency graph. Until it is
      # enabled the step is skipped with a warning; the licenses job above
      # still enforces the license policy on the whole lockfile.
      - name: Grafo delle dipendenze
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Il dependency graph non è attivo: dependency review saltata. Attivarlo in Settings, Code security."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # Blocks new dependencies with known high or critical vulnerabilities
      # or with a strong copyleft license. The full license policy is in
      # scripts/licenses/lib.mjs.
      - uses: actions/dependency-review-action@v4
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure
