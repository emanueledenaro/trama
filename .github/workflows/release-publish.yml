name: Pubblicazione del rilascio
# When main carries a version of app/package.json with a CHANGELOG.md section
# and no v* tag yet, creates a draft release, builds the packages, attaches
# them with the SHA-256 checksums and publishes the release, which creates the
# tag. Tags are never moved. Policy in docs/agents/versioning.md.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-publish
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      ref: ${{ steps.draft.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Release in bozza
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Il tag $tag esiste già: nessun rilascio."
            exit 0
          fi
          if ! node scripts/release/cli.mjs notes "$version" > notes.md; then
            echo "CHANGELOG.md non ha una sezione per $version: nessun rilascio."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # A resumed draft keeps its original target: build that commit, not the new push.
            ref=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            echo "La bozza $tag esiste già: la riprendo sul commit $ref."
          else
            ref="$GITHUB_SHA"
            prerelease=()
            # A beta (X.Y.Z-beta.N) is a pre-release on GitHub (docs/agents/versioning.md).
            case "$version" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$tag" --draft "${prerelease[@]}" --target "$ref" --title "$tag" --notes-file notes.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
  package:
    needs: draft
    if: needs.draft.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.draft.outputs.ref }}
      tag: ${{ needs.draft.outputs.tag }}
    secrets: inherit
