name: Rilascio
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Called by release-publish.yml with the commit to build and the draft
  # release that receives the packages.
  workflow_call:
    inputs:
      ref:
        description: Commit da impacchettare
        required: true
        type: string
      tag:
        description: Release in bozza che riceve i pacchetti
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dipendenze
        run: npm ci
      - name: Controllo dei tipi e test
        run: npm run typecheck && npm test
      - name: Build
        run: npm run build
      # Firma e notarizzazione partono solo quando i secret esistono: senza, il pacchetto resta non firmato.
      - name: Pacchetto
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=()
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ "${{ matrix.target }}" = "--mac" ] && [ -n "$APPLE_ID" ] && [ -n "$CSC_LINK" ]; then extra+=("-c.mac.notarize=true"); fi
          npx electron-builder ${{ matrix.target }} --publish never "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: trama-${{ matrix.os }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.AppImage
          if-no-files-found: error
  # Attaches the packages to the draft release and publishes it. Publishing
  # creates the tag, so it happens only once every package is in place.
  publish:
    needs: package
    if: inputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: trama-*
          merge-multiple: true
      - name: Pubblicazione
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" packages/*
          gh release edit "$TAG" --draft=false --latest
