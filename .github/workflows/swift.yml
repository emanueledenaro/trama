name: Swift
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Codex per le prove della sandbox
        run: npm install --global @openai/codex@0.148.0
      - name: Versione Swift
        run: swift --version
      - name: Test
        run: swift test
      - name: App macOS
        run: bash scripts/build-app.sh release
